<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="650" height="200">
    <defs>
        <!-- Degradado tecnológico de Cian a Violeta para la estrella -->
        <linearGradient id="novaGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#7E57C2" />
        </linearGradient>

        <!-- Máscara para crear un espacio negativo alrededor de la estrella -->
        <mask id="starCutout">
            <!-- Fondo blanco: mantiene visible todo el diseño -->
            <rect width="100%" height="100%" fill="white" />
            <!-- Estrella negra con borde: recorta la parte superior derecha de la 'D' -->
            <path d="M 140,10 C 140,30 155,45 175,45 C 155,45 140,60 140,80 C 140,60 125,45 105,45 C 125,45 140,30 140,10 Z" 
                  fill="black" stroke="black" stroke-width="10" stroke-linejoin="round" />
        </mask>
    </defs>

    <!-- ICONO PRINCIPAL: La letra 'D' estilizada -->
    <!-- Se dibuja con geometría precisa y esquinas suavemente redondeadas en el lado izquierdo -->
    <path d="M 50,62 C 50,55.4 55.4,50 62,50 H 100 C 127.6,50 150,72.4 150,100 C 150,127.6 127.6,150 100,150 H 62 C 55.4,150 50,144.6 50,138 Z M 74,74 V 126 H 100 C 114.4,126 126,114.4 126,100 C 126,85.6 114.4,74 100,74 Z" 
          fill="#0A192F" mask="url(#starCutout)" />

    <!-- ESTRELLA FUGAZ / EXPLOSIÓN NOVA -->
    <!-- Ubicada en la intersección superior derecha -->
    <path d="M 140,10 C 140,30 155,45 175,45 C 155,45 140,60 140,80 C 140,60 125,45 105,45 C 125,45 140,30 140,10 Z" 
          fill="url(#novaGradient)" />

    <!-- TEXTO DE LA MARCA -->
    <!-- 'Dev' en color corporativo, 'Nova' asimilando la energía de la estrella -->
    <text x="195" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">
        <tspan fill="#0A192F">Dev</tspan><tspan fill="url(#novaGradient)">Nova</tspan>
    </text>

    <!-- SUBTÍTULO CORPORATIVO -->
    <!-- Aporta equilibrio y refuerza el giro comercial -->
    <text x="200" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="5" fill="#666666">
        SOFTWARE DEVELOPMENT
    </text>
</svg>
